name: cch daily smoke
run-name: ${{ inputs.scheduled_date && format('CCH daily smoke · {0}', inputs.scheduled_date) || (github.event_name == 'schedule' && 'CCH daily smoke · GitHub fallback' || 'CCH daily smoke · manual') }}

on:
  schedule:
    - cron: "17 2 * * *" # 10:17 Asia/Shanghai; fallback for the server timer
  workflow_dispatch:
    inputs:
      scheduled_date:
        description: "Daily scheduler date in Asia/Shanghai (YYYY-MM-DD); leave empty for manual runs"
        required: false
        default: ""
        type: string
      fiber_source:
        description: "Fiber package source"
        required: false
        default: release
        type: choice
        options:
          - release
          - develop
          - pr
      fiber_pr_number:
        description: "Fiber PR number; required when source is pr"
        required: false
        default: ""
        type: string
      send_discord_report:
        description: "Send the Discord report for this manual preview run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cch-daily-smoke-test-new-02
  cancel-in-progress: false

jobs:
  daily-gate:
    runs-on: [self-hosted, test-new-02]
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.claim.outputs.should_run }}
      scheduled_date: ${{ steps.claim.outputs.scheduled_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Claim the daily execution
        id: claim
        env:
          SCHEDULED_DATE: ${{ inputs.scheduled_date || '' }}
          FIBER_SOURCE: ${{ inputs.fiber_source || 'release' }}
          FIBER_PR_NUMBER: ${{ inputs.fiber_pr_number || '' }}
        run: python3 scripts/claim_daily_smoke.py

  cch-daily-smoke:
    needs: daily-gate
    if: ${{ needs.daily-gate.outputs.should_run == 'true' }}
    runs-on: [self-hosted, test-new-02]
    timeout-minutes: 30
    outputs:
      started_at: ${{ steps.report_start.outputs.started_at }}
      duration_seconds: ${{ steps.report_metadata.outputs.duration_seconds }}
      fnn_version: ${{ steps.update_fnn.outputs.fnn_version }}
      fnn_package: ${{ steps.update_fnn.outputs.fnn_package }}
      checkout_outcome: ${{ steps.checkout.outcome }}
      python_outcome: ${{ steps.setup_python.outcome }}
      dependencies_outcome: ${{ steps.install_dependencies.outcome }}
      unit_outcome: ${{ steps.unit_tests.outcome }}
      auth_outcome: ${{ steps.prepare_auth.outcome }}
      fnn_outcome: ${{ steps.update_fnn.outcome }}
      liquidity_outcome: ${{ steps.lnd_liquidity.outcome }}
      local_outcome: ${{ steps.local_cch.outcome }}
      direct_outcome: ${{ steps.fiberswap_direct.outcome }}
      relay_outcome: ${{ steps.fiberswap_relay.outcome }}
      cleanup_outcome: ${{ steps.cleanup_auth.outcome }}
      local_report: ${{ steps.local_cch.outputs.report }}
      direct_report: ${{ steps.fiberswap_direct.outputs.report }}
      relay_report: ${{ steps.fiberswap_relay.outputs.report }}
    env:
      CCH_SMOKE_ENABLED: "1"
      CCH_SMOKE_FNN_SOURCE: ${{ inputs.fiber_source || 'release' }}
      CCH_SMOKE_FNN_PR_NUMBER: ${{ inputs.fiber_pr_number || '' }}
      CCH_SMOKE_FNN_CLI: /home/ckb/fiber-test/testnet/node1/fnn-cli
      CCH_SMOKE_F1_RPC: http://127.0.0.1:8227
      CCH_SMOKE_F2_RPC: http://127.0.0.1:8229
      CCH_SMOKE_LND_A_CONTAINER: lnd-a
      CCH_SMOKE_LND_B_CONTAINER: lnd-b
      CCH_SMOKE_LND_DIR: /data/.lnd
      CCH_SMOKE_LND_NETWORK: testnet4
      CCH_SMOKE_LND_MIN_SPENDABLE_SATS: "1000000"
      CCH_SMOKE_LND_TOPUP_SATS: "3000000"
      CCH_FIBER_SWAP_SMOKE_ENABLED: "1"
      CCH_FIBER_SWAP_FNN_CLI: /home/ckb/fiber-test/testnet/node1/fnn-cli
      CCH_FIBER_SWAP_F2_RPC: http://127.0.0.1:8229
      CCH_FIBER_SWAP_AMOUNT_SATS: "100"
      CCH_FIBER_SWAP_MAX_CCH_FEE_SATS: "100"
      CCH_FIBER_SWAP_MAX_FIBER_FEE: "100"
      CCH_FIBER_SWAP_LND_FEE_LIMIT_SATS: "10"
      CCH_FIBER_SWAP_PAYMENT_TIMEOUT: "120"
      CCH_FIBER_SWAP_API_BASE_URL: https://fiber-swap-api.retric.uk
      CCH_FIBER_SWAP_LND_D_CONTAINER: lnd-d
      CCH_FIBER_SWAP_LND_DIR: /data/.lnd
      CCH_FIBER_SWAP_LND_NETWORK: testnet
      CCH_FIBER_SWAP_LND_D_PUBKEY: 027431fbdbbc67df1ed0cf30568fe8ab04ef2fbff296ebcc0c826dc01e923799f5
      CCH_FIBER_SWAP_LND_REMOTE_PUBKEY: 03c7796e27b079b25ea5c9f02dbb289ab1720248ecdd25dceed7cd489f2fe6290d
      CCH_FIBER_SWAP_LND_CHANNEL_POINT: 70fdfd0dd7960b1b7ca1f562ae031b3a37925fa957eb97c97536f82ed5f37c35:1
      CCH_FIBER_SWAP_BOTTLE_PUBKEY: 02b6d4e3ab86a2ca2fad6fae0ecb2e1e559e0b911939872a90abdda6d20302be71
      CCH_FIBER_SWAP_FIBER_CHANNEL_ID: "0x4b6513e2d1ad8341366d3b0733f00306aee7e2db21e669a30aba5d33a1ed5536"

    steps:
      - name: Start report timer
        id: report_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install_dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        id: unit_tests
        run: |
          python -m pytest -q \
            --ignore=tests/test_cch_daily_smoke.py \
            --ignore=tests/test_fiber_swap_daily_smoke.py \
            --ignore=tests/test_fiber_swap_relay_daily_smoke.py

      - name: Prepare FNN auth file
        id: prepare_auth
        env:
          FNN_AUTH_TOKEN: ${{ secrets.CCH_SMOKE_FNN_AUTH_TOKEN }}
        run: |
          FNN_AUTH_TOKEN_VALUE="${FNN_AUTH_TOKEN:-}"
          unset FNN_AUTH_TOKEN
          if [ -z "$FNN_AUTH_TOKEN_VALUE" ]; then
            echo "::error::Missing repository secret CCH_SMOKE_FNN_AUTH_TOKEN."
            exit 1
          fi

          FNN_AUTH_FILE="$(mktemp "${RUNNER_TEMP}/cch-fnn-auth.XXXXXX")"
          cleanup_failed_prepare() {
            rm -f -- "$FNN_AUTH_FILE"
          }
          trap cleanup_failed_prepare EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          chmod 600 "$FNN_AUTH_FILE"
          printf '%s' "$FNN_AUTH_TOKEN_VALUE" > "$FNN_AUTH_FILE"
          unset FNN_AUTH_TOKEN_VALUE
          {
            printf 'CCH_SMOKE_FNN_AUTH_TOKEN_FILE=%s\n' "$FNN_AUTH_FILE"
            printf 'CCH_FIBER_SWAP_FNN_AUTH_TOKEN_FILE=%s\n' "$FNN_AUTH_FILE"
            printf 'CCH_FNN_AUTH_TEMP_FILE=%s\n' "$FNN_AUTH_FILE"
          } >> "$GITHUB_ENV"
          trap - EXIT HUP INT TERM

      - name: Update and verify Fiber nodes
        id: update_fnn
        run: scripts/update_fnn.sh

      - name: Ensure LND outbound liquidity
        id: lnd_liquidity
        run: python scripts/ensure_lnd_liquidity.py

      - name: Run local CCH smoke
        id: local_cch
        run: |
          python -m pytest -q -s --no-header \
            tests/test_cch_daily_smoke.py::test_cch_daily_smoke_bidirectional

      - name: Run FiberSwap CCH smoke (direct Lightning channel)
        id: fiberswap_direct
        run: |
          python -m pytest -q -s --no-header \
            tests/test_fiber_swap_daily_smoke.py::test_fiber_swap_bidirectional

      - name: Run FiberSwap CCH smoke (via relay LND)
        id: fiberswap_relay
        env:
          CCH_FIBER_SWAP_RELAY_SMOKE_ENABLED: "1"
          CCH_FIBER_SWAP_RELAY_LND_CONTAINER: lnd-c
          CCH_FIBER_SWAP_RELAY_NODE_PUBKEY: 03676dd479c6c5422bdcec4691f42f1a6c6b386519b431542e03f31e773d570a41
          CCH_FIBER_SWAP_RELAY_CHANNEL_POINT: 0cedcc728ba1a51582c6650fc14f1a862912ee4ea400a94049c83326b7e5408e:1
          CCH_FIBER_SWAP_RELAY_TO_FIBER_SWAP_SCID: "5637388530143199233"
          CCH_FIBER_SWAP_RELAY_LND_FEE_LIMIT_SATS: "80"
        run: |
          python -m pytest -q -s --no-header \
            tests/test_fiber_swap_relay_daily_smoke.py::test_fiber_swap_via_relay_lnd_bidirectional

      - name: Remove FNN auth file
        id: cleanup_auth
        if: ${{ always() }}
        run: |
          if [ -n "${CCH_FNN_AUTH_TEMP_FILE:-}" ]; then
            rm -f -- "$CCH_FNN_AUTH_TEMP_FILE"
          fi

      - name: Finalize report metadata
        id: report_metadata
        if: ${{ always() }}
        env:
          STARTED_AT: ${{ steps.report_start.outputs.started_at }}
        run: |
          if [[ "$STARTED_AT" =~ ^[0-9]+$ ]]; then
            echo "duration_seconds=$(( $(date +%s) - STARTED_AT ))" >> "$GITHUB_OUTPUT"
          fi

  notify-discord:
    runs-on: ubuntu-22.04
    needs: [daily-gate, cch-daily-smoke]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.send_discord_report) && (needs.daily-gate.outputs.should_run == 'true' || needs.daily-gate.result == 'failure') }}

    steps:
      - uses: actions/checkout@v7
        continue-on-error: true

      - name: Send scheduled Discord report
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CCH_REPORT_JOB_RESULT: ${{ needs.daily-gate.result == 'failure' && 'failure' || needs.cch-daily-smoke.result }}
          CCH_REPORT_GATE_OUTCOME: ${{ needs.daily-gate.result }}
          CCH_REPORT_SCHEDULED_DATE: ${{ needs.daily-gate.outputs.scheduled_date }}
          CCH_REPORT_STARTED_AT: ${{ needs.cch-daily-smoke.outputs.started_at }}
          CCH_REPORT_TRIGGER: ${{ github.event_name }}
          CCH_REPORT_BRANCH: ${{ github.ref_name }}
          CCH_REPORT_FIBER_SOURCE: ${{ inputs.fiber_source || 'release' }}
          CCH_REPORT_FNN_VERSION: ${{ needs.cch-daily-smoke.outputs.fnn_version }}
          CCH_REPORT_FNN_PACKAGE: ${{ needs.cch-daily-smoke.outputs.fnn_package }}
          CCH_REPORT_TOTAL_SECONDS: ${{ needs.cch-daily-smoke.outputs.duration_seconds }}
          CCH_REPORT_CHECKOUT_OUTCOME: ${{ needs.cch-daily-smoke.outputs.checkout_outcome }}
          CCH_REPORT_PYTHON_OUTCOME: ${{ needs.cch-daily-smoke.outputs.python_outcome }}
          CCH_REPORT_DEPENDENCIES_OUTCOME: ${{ needs.cch-daily-smoke.outputs.dependencies_outcome }}
          CCH_REPORT_UNIT_OUTCOME: ${{ needs.cch-daily-smoke.outputs.unit_outcome }}
          CCH_REPORT_AUTH_OUTCOME: ${{ needs.cch-daily-smoke.outputs.auth_outcome }}
          CCH_REPORT_FNN_OUTCOME: ${{ needs.cch-daily-smoke.outputs.fnn_outcome }}
          CCH_REPORT_LIQUIDITY_OUTCOME: ${{ needs.cch-daily-smoke.outputs.liquidity_outcome }}
          CCH_REPORT_LOCAL_OUTCOME: ${{ needs.cch-daily-smoke.outputs.local_outcome }}
          CCH_REPORT_DIRECT_OUTCOME: ${{ needs.cch-daily-smoke.outputs.direct_outcome }}
          CCH_REPORT_RELAY_OUTCOME: ${{ needs.cch-daily-smoke.outputs.relay_outcome }}
          CCH_REPORT_CLEANUP_OUTCOME: ${{ needs.cch-daily-smoke.outputs.cleanup_outcome }}
          CCH_REPORT_LOCAL_JSON: ${{ needs.cch-daily-smoke.outputs.local_report }}
          CCH_REPORT_DIRECT_JSON: ${{ needs.cch-daily-smoke.outputs.direct_report }}
          CCH_REPORT_RELAY_JSON: ${{ needs.cch-daily-smoke.outputs.relay_report }}
          CCH_REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CCH_REPORT_RUN_NUMBER: ${{ github.run_number }}
          CCH_REPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CCH_REPORT_SHA: ${{ github.sha }}
        run: python3 scripts/send_daily_smoke_report.py
