name: cch scheduler administration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Check, verify dispatch permission, install, or pause the server timer"
        type: choice
        default: check
        options:
          - check
          - install
          - verify-dispatch
          - pause

permissions:
  contents: read

concurrency:
  group: cch-daily-smoke-scheduler-admin
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, test-new-02]
    timeout-minutes: 5
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check server scheduling prerequisites (read only)
        shell: bash
        run: |
          set -uo pipefail
          printf 'Runner user: %s\n' "$(id -un)"
          date --iso-8601=seconds
          timedatectl show -p Timezone -p NTPSynchronized || true
          systemctl --version | head -n 1
          if sudo -n true; then
            echo 'Non-interactive sudo: available'
          else
            echo 'Non-interactive sudo: unavailable'
          fi
          if command -v gh >/dev/null; then
            command -v gh
            gh --version | head -n 1
            # Do not use job tokens or print stored credentials.
            if env -u GH_TOKEN -u GITHUB_TOKEN gh api \
              repos/sunchengzhu/cch-daily-smoke/actions/workflows/cch-daily-smoke.yml \
              --jq '{id, state}'; then
              echo 'Existing server GitHub CLI access: available'
              env -u GH_TOKEN -u GITHUB_TOKEN gh api user --jq .login
              env -u GH_TOKEN -u GITHUB_TOKEN gh api \
                repos/sunchengzhu/cch-daily-smoke --jq .permissions
            else
              echo 'Existing server GitHub CLI access: unavailable'
            fi
          else
            echo 'GitHub CLI: not installed'
          fi

      - uses: actions/checkout@v7
        if: ${{ inputs.operation == 'install' }}
        with:
          persist-credentials: false

      - name: Install and verify the server timer
        if: ${{ inputs.operation == 'install' }}
        env:
          CCH_SMOKE_DISPATCH_TOKEN: ${{ secrets.CCH_SMOKE_DISPATCH_TOKEN }}
        run: bash scripts/install_daily_smoke_timer.sh

      - name: Explicitly verify dispatch permission
        if: ${{ inputs.operation == 'verify-dispatch' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.CCH_SMOKE_DISPATCH_TOKEN }}
        run: |
          if [[ "$(TZ=Asia/Shanghai date +%H)" < "10" ]]; then
            echo 'Verify after 10:00 Asia/Shanghai so the daily gate can execute the test.' >&2
            exit 1
          fi
          unset GH_TOKEN GITHUB_TOKEN
          if [[ -n "$DISPATCH_TOKEN" ]]; then
            export GH_TOKEN="$DISPATCH_TOKEN"
          fi
          unset DISPATCH_TOKEN
          gh workflow run cch-daily-smoke.yml \
            --repo sunchengzhu/cch-daily-smoke --ref main \
            --raw-field scheduled_date="$(TZ=Asia/Shanghai date +%F)" \
            --raw-field fiber_source=release --raw-field send_discord_report=true

      - name: Pause the server timer
        if: ${{ inputs.operation == 'pause' }}
        run: |
          sudo -n systemctl disable --now cch-daily-smoke-dispatch.timer
          sudo -n systemctl stop cch-daily-smoke-dispatch.service

      - name: Read installed scheduler status
        if: ${{ always() }}
        run: |
          systemctl show cch-daily-smoke-dispatch.service -p LoadState -p Result -p ExecMainStatus
          systemctl list-timers cch-daily-smoke-dispatch.timer --all --no-pager
          sudo -n journalctl -u cch-daily-smoke-dispatch.service -n 20 --no-pager
